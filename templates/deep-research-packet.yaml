working_thesis: ""
article_type: blog_article
target_audience: ""

# Minimal context for Deep Research.
input_prompt: |
  Use the research question, existing draft, and candidate sources below to strengthen the argument, fill evidence gaps, identify high-risk claims, and produce a research packet for the later blog rewrite.
  Do not generate the final publishable article.
  Do not use self-citations or nonexistent sources.
  If evidence is insufficient, mark the claim as needs verification.

# First draft, older draft, or user-provided text.
seed_draft: |
  

# Candidate sources can include known papers, statutes, policy documents, and audit reports.
candidate_sources:
  - title: ""
    url: ""
    reason: ""

must_use_sources:
  - ""

must_not_use_sources:
  - "user draft as an external source"
  - "self-citation placeholders such as mashbean, 2026"

claims_to_verify:
  - ""

open_questions:
  - ""

style_constraints:
  - "final output will become a long-form English blog article"
  - "avoid report-like and executive-summary prose"
  - "do not generate visible prompt leakage"

citation_constraints:
  - "prefer academic papers, official documents, statutes, and audit reports"
  - "do not force a conclusion when evidence is insufficient"

expected_outputs:
  - evidence_map
  - source_notes
  - high_risk_claims
  - suggested_structure
  - research_summary
